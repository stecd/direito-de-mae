<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Direito de Mãe</title>
<style>
  :root { --bg:#efeae2; --head:#008069; --me:#d9fdd3; --bot:#ffffff; --ink:#111b21; --muted:#667781; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,Segoe UI,Roboto,sans-serif; background:#d1d7db; color:var(--ink); }
  .phone { max-width:460px; height:100vh; margin:0 auto; display:flex; flex-direction:column; background:var(--bg); }
  header { background:var(--head); color:#fff; padding:12px 16px; display:flex; align-items:center; gap:12px; }
  .avatar { width:40px; height:40px; border-radius:50%; background:#fff; color:var(--head); display:grid; place-items:center; font-weight:700; }
  header b { display:block; } header small { opacity:.85; }
  #chat { flex:1; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:6px; }
  .msg { max-width:82%; padding:7px 10px; border-radius:8px; box-shadow:0 1px .5px rgba(0,0,0,.13); white-space:pre-wrap; line-height:1.35; font-size:15px; }
  .me { align-self:flex-end; background:var(--me); }
  .bot { align-self:flex-start; background:var(--bot); }
  .msg img { max-width:100%; border-radius:6px; display:block; }
  .msg audio { width:240px; display:block; }
  .msg a { color:#027eb5; font-weight:600; }
  .typing { color:var(--muted); font-style:italic; }
  footer { display:flex; gap:8px; padding:8px; background:#f0f2f5; align-items:center; }
  #text { flex:1; border:none; border-radius:20px; padding:10px 14px; font-size:15px; outline:none; }
  .btn { width:44px; height:44px; border-radius:50%; border:none; background:var(--head); color:#fff; font-size:20px; cursor:pointer; flex:none; }
  .btn.clip { background:transparent; color:var(--muted); }
  .btn.rec { background:#e53935; animation:pulse 1s infinite; }
  .phone.drop #chat { outline:3px dashed var(--head); outline-offset:-10px; background:#e2f3ef; }
  @keyframes pulse { 50% { opacity:.6; } }
</style>
</head>
<body>
<div class="phone">
  <header><div class="avatar">DM</div><div><b>Direito de Mãe</b><small>seus direitos de mãe no trabalho</small></div></header>
  <div id="chat"></div>
  <footer>
    <button class="btn clip" id="clip" title="Enviar print">📎</button>
    <input type="file" id="file" accept="image/*,audio/*" hidden>
    <input id="text" placeholder="Mensagem" autocomplete="off">
    <button class="btn" id="mic" title="Segure para gravar">🎤</button>
  </footer>
</div>
<script>
const chat = document.getElementById('chat'), text = document.getElementById('text');
const mic = document.getElementById('mic'), fileIn = document.getElementById('file');

function bubble(cls, html) {
  const d = document.createElement('div'); d.className = 'msg ' + cls; d.innerHTML = html;
  chat.appendChild(d); chat.scrollTop = chat.scrollHeight; return d;
}
let SID;
try { SID = localStorage.getItem('dm_sid'); if (!SID) { SID = newId(); localStorage.setItem('dm_sid', SID); } }
catch (e) { SID = SID || newId(); }
function newId() {
  try { return crypto.randomUUID(); } catch (e) {}
  return 'x' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 12);
}
async function toJpeg(f) {
  try {
    const url = URL.createObjectURL(f);
    const img = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = url; });
    const k = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas');
    c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
    const blob = await new Promise(ok => c.toBlob(ok, 'image/jpeg', 0.85));
    return blob ? new File([blob], 'foto.jpg', { type:'image/jpeg' }) : f;
  } catch (e) { return f; }
}
const esc = s => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

async function send(body, file) {
  const fd = new FormData(); fd.append('text', body || ''); fd.append('sid', SID);
  if (file) fd.append('file', file, file.name || 'audio.webm');
  const wait = bubble('bot typing', 'digitando…');
  try {
    const ctl = new AbortController(); const timer = setTimeout(() => ctl.abort(), 60000);
    let r; try { r = await fetch('/web', { method:'POST', body:fd, signal:ctl.signal }); } finally { clearTimeout(timer); }
    if (!r.ok) throw new Error('http ' + r.status);
    const { messages } = await r.json();
    wait.remove();
    for (const m of messages) {
      if (m.text) bubble('bot', esc(m.text));
      if (m.media) {
        if (/\.ogg$/.test(m.media)) { const mp3 = m.media.replace(/\.ogg$/, '.mp3'); const b = bubble('bot', `<audio controls><source src="${mp3}" type="audio/mpeg"><source src="${m.media}" type="audio/ogg; codecs=opus"></audio>`); b.querySelector('audio').play().catch(()=>{}); }
        else if (/\.(mp3|webm|m4a|mp4)$/.test(m.media)) { const b = bubble('bot', `<audio controls src="${m.media}"></audio>`); b.querySelector('audio').play().catch(()=>{}); }
        else if (/\.pdf$/.test(m.media)) bubble('bot', `📄 <a href="${m.media}" target="_blank">dossie.pdf</a>`);
      }
    }
  } catch (e) { wait.remove(); bubble('bot', e.name === 'AbortError' ? 'Demorou demais para responder. Tente de novo em instantes.' : 'Erro de conexão. Tente de novo.'); }
}

text.addEventListener('keydown', e => {
  if (e.key === 'Enter' && text.value.trim()) { const v = text.value.trim(); text.value=''; bubble('me', esc(v)); send(v); }
});

async function sendFile(f) {
  if (!f) return;
  const caption = text.value.trim(); text.value = '';
  if (f.type.startsWith('image/') || /\.(heic|heif)$/i.test(f.name || '')) { f = await toJpeg(f); bubble('me', `<img src="${URL.createObjectURL(f)}">`); }
  else if (f.type.startsWith('audio/')) bubble('me', `<audio controls src="${URL.createObjectURL(f)}"></audio>`);
  else bubble('me', esc('📎 ' + (f.name || 'arquivo')));
  send(caption, f);
}
document.getElementById('clip').onclick = () => fileIn.click();
fileIn.onchange = () => { const f = fileIn.files[0]; fileIn.value = ''; sendFile(f); };

// Drag and drop a screenshot anywhere on the page.
const phone = document.querySelector('.phone');
['dragenter','dragover'].forEach(ev => document.addEventListener(ev, e => { e.preventDefault(); phone.classList.add('drop'); }));
['dragleave','drop'].forEach(ev => document.addEventListener(ev, e => { e.preventDefault(); if (ev === 'drop' || !e.relatedTarget) phone.classList.remove('drop'); }));
document.addEventListener('drop', e => { [...e.dataTransfer.files].forEach(sendFile); });
// Paste a screenshot (Cmd+V) too.
document.addEventListener('paste', e => { [...(e.clipboardData?.files || [])].forEach(sendFile); });

// Tap mic to start recording, tap again to send.
let rec = null, chunks = [];
mic.onclick = async () => {
  if (rec) { rec.stop(); return; }
  let stream;
  try {
    if (!navigator.mediaDevices?.getUserMedia || typeof MediaRecorder === 'undefined') throw new Error('no mic');
    stream = await navigator.mediaDevices.getUserMedia({ audio:true });
    rec = new MediaRecorder(stream); chunks = [];
  } catch (e) {
    if (stream) stream.getTracks().forEach(t => t.stop()); rec = null;
    bubble('bot', 'Não consegui usar o microfone. Você pode escrever ou mandar um print.'); return;
  }
  rec.ondataavailable = e => chunks.push(e.data);
  rec.onstop = () => {
    stream.getTracks().forEach(t => t.stop()); mic.classList.remove('rec'); mic.textContent = '🎤';
    const type = rec.mimeType.split(';')[0] || 'audio/webm';
    const blob = new Blob(chunks, { type }); rec = null;
    const f = new File([blob], type.includes('mp4') ? 'audio.m4a' : 'audio.webm', { type });
    bubble('me', `<audio controls src="${URL.createObjectURL(blob)}"></audio>`);
    send('', f);
  };
  rec.start(); mic.classList.add('rec'); mic.textContent = '■';
};
</script>
</body>
</html>
